<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title description">
  <title id="title">CareerPilot matching benchmark: match-v1 compared with match-v2</title>
  <desc id="description">Grouped bar chart. Match-v2 improves status accuracy from 84.3 to 94.1 percent, evidence-source accuracy from 78.4 to 84.3 percent, and strict semantic accuracy from 74.5 to 82.3 percent.</desc>
  <style>
    .text { fill: #1f2328; font-family: system-ui, sans-serif; }
    .muted { fill: #59636e; font-family: system-ui, sans-serif; }
    .grid { stroke: #d8dee4; stroke-width: 1; }
    .axis { stroke: #8c959f; stroke-width: 1.5; }
    .v1 { fill: #8250df; }
    .v2 { fill: #1a7f37; }
    @media (prefers-color-scheme: dark) {
      .text { fill: #f0f6fc; }
      .muted { fill: #9198a1; }
      .grid { stroke: #30363d; }
      .axis { stroke: #6e7681; }
      .v1 { fill: #a371f7; }
      .v2 { fill: #3fb950; }
    }
  </style>

  <text class="text" x="450" y="34" text-anchor="middle" font-size="24" font-weight="600">Matching benchmark: match-v1 vs match-v2</text>
  <text class="muted" x="450" y="58" text-anchor="middle" font-size="14">Frozen 17-case benchmark · 3 runs per case · 51 total runs</text>

  <rect class="v1" x="326" y="76" width="16" height="16" rx="2"/>
  <text class="text" x="350" y="89" font-size="14">match-v1</text>
  <rect class="v2" x="438" y="76" width="16" height="16" rx="2"/>
  <text class="text" x="462" y="89" font-size="14">match-v2</text>

  <line class="grid" x1="90" y1="110" x2="850" y2="110"/>
  <line class="grid" x1="90" y1="176" x2="850" y2="176"/>
  <line class="grid" x1="90" y1="242" x2="850" y2="242"/>
  <line class="grid" x1="90" y1="308" x2="850" y2="308"/>
  <line class="axis" x1="90" y1="374" x2="850" y2="374"/>
  <line class="axis" x1="90" y1="110" x2="90" y2="374"/>

  <text class="muted" x="78" y="115" text-anchor="end" font-size="13">100%</text>
  <text class="muted" x="78" y="181" text-anchor="end" font-size="13">75%</text>
  <text class="muted" x="78" y="247" text-anchor="end" font-size="13">50%</text>
  <text class="muted" x="78" y="313" text-anchor="end" font-size="13">25%</text>
  <text class="muted" x="78" y="379" text-anchor="end" font-size="13">0%</text>

  <rect class="v1" x="153" y="151.4" width="52" height="222.6" rx="3"/>
  <rect class="v2" x="213" y="125.6" width="52" height="248.4" rx="3"/>
  <text class="text" x="179" y="142" text-anchor="middle" font-size="14" font-weight="600">84.3%</text>
  <text class="text" x="239" y="116" text-anchor="middle" font-size="14" font-weight="600">94.1%</text>

  <rect class="v1" x="403" y="167.0" width="52" height="207.0" rx="3"/>
  <rect class="v2" x="463" y="151.4" width="52" height="222.6" rx="3"/>
  <text class="text" x="429" y="158" text-anchor="middle" font-size="14" font-weight="600">78.4%</text>
  <text class="text" x="489" y="142" text-anchor="middle" font-size="14" font-weight="600">84.3%</text>

  <rect class="v1" x="653" y="177.3" width="52" height="196.7" rx="3"/>
  <rect class="v2" x="713" y="156.7" width="52" height="217.3" rx="3"/>
  <text class="text" x="679" y="168" text-anchor="middle" font-size="14" font-weight="600">74.5%</text>
  <text class="text" x="739" y="147" text-anchor="middle" font-size="14" font-weight="600">82.3%</text>

  <text class="text" x="209" y="408" text-anchor="middle" font-size="15">Status</text>
  <text class="text" x="209" y="428" text-anchor="middle" font-size="15">accuracy</text>
  <text class="text" x="459" y="408" text-anchor="middle" font-size="15">Evidence-source</text>
  <text class="text" x="459" y="428" text-anchor="middle" font-size="15">accuracy</text>
  <text class="text" x="709" y="408" text-anchor="middle" font-size="15">Strict semantic</text>
  <text class="text" x="709" y="428" text-anchor="middle" font-size="15">accuracy</text>

  <text class="muted" x="470" y="474" text-anchor="middle" font-size="13">Accuracy (%)</text>
</svg>
